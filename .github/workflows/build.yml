name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cari folder project
        id: find
        run: |
          F=$(find . -name settings.gradle.kts -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$F" ]; then
            echo "settings.gradle.kts tidak ditemukan. Struktur repo:"
            find . -not -path "./.git/*" | head -50
            exit 1
          fi
          D=$(dirname "$F")
          echo "Project ada di: $D"
          echo "dir=$D" >> $GITHUB_OUTPUT

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DRAG-CELK4-HS-debug-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
