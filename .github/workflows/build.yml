name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak ZIP project
        run: |
          mkdir -p project
          unzip -o DRAG_CELK4_HS_Launcher_Project.zip -d project

      - name: Samakan versi Java ke 17
        run: |
          cat >> project/app/build.gradle.kts << 'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DRAG-CELK4-HS-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
